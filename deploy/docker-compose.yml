# 社内ネットワーク用のデプロイ（http、ドメインなし）。使い方は deploy/README.md。
#
#   サーバーでは版ごとのフォルダー（/srv/ops/releases/ops-…）に展開し、deploy/install.sh で起動する。
#   設定（.env）・バックアップ・ログは版の外の /srv/ops に置く（README の「1.2 ファイルの置き場所」）。
#   docker compose のコマンドは /srv/ops/current/deploy で実行する。
#
# サービス:
#   db      PostgreSQL 16（データは名前付きボリューム pgdata）
#   app     API（起動のたびに alembic upgrade head してから uvicorn）
#   worker  定期処理（自動リリースと締切の監視を毎分・予定の生成を毎日 00:05）。タスク スケジューラーの代わり
#   web     画面（nginx）。http://<サーバー>:${HTTP_PORT}/ で開き、/api/ を app へ転送する
#   backup  毎日の pg_dump を ./backups（BACKUP_DIR）へ。古いものは BACKUP_KEEP_DAYS 日で消す
name: ops

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# イメージを作るときの会社のプロキシ（.env の HTTP_PROXY / HTTPS_PROXY / NO_PROXY）。ふつうは空 = 直接つなぐ
# （2026-11-17: たぶん要らないと分かった）。要るときだけ apt / pip / npm が使う（README の付録）。
# 動いているコンテナには渡さない（インターネットに出る必要がないため）
x-build-args: &build-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-}

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  ENVIRONMENT: production
  COOKIE_SECURE: "false"   # http で配信するため（https にしたら true）
  SQL_ECHO: "false"
  TZ: Asia/Tokyo
  # プロキシを使う設定にして、Docker がそれをコンテナにも渡したときの備え: コンテナどうしと自分自身への通信は通さない
  NO_PROXY: localhost,127.0.0.1,db,app,web
  no_proxy: localhost,127.0.0.1,db,app,web

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  app:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
      args: *build-args
    image: ops-app:latest
    restart: unless-stopped
    environment:
      <<: *app-env
      LOG_FILE: /app/logs/app.log
    volumes:
      - ${LOG_DIR:-./logs}:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health/app はログインなしで 200（src/worker_health/router.py）。ワーカーの状態は見ない（worker はこの後に起動する）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/app')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *logging

  worker:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
      args: *build-args
    image: ops-app:latest
    restart: unless-stopped
    command: ["python", "-m", "scripts.worker"]
    environment:
      <<: *app-env
      WORKER_EXTEND_AT: "00:05"
      WORKER_EVENT_LOOKBACK_HOURS: "24"   # 締切の監視が振り返る幅（これより前に過ぎた締切は記録しない）
      # 通知のメール（.env で設定。空なら既定値。SMTP_HOST が空だと、本番ではメールを送らず配信は失敗として見える）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-}
      APP_BASE_URL: ${APP_BASE_URL:-}   # 通知の本文に入れる画面へのリンクの先頭（例: http://10.0.0.5）。空ならリンクなし
    depends_on:
      app:
        condition: service_healthy   # app がマイグレーションを終えてから動かす
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args: *build-args
    image: ops-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - app
    logging: *logging

  backup:
    image: postgres:16
    restart: unless-stopped
    command: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-01:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Tokyo
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
