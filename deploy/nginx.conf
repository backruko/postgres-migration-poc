# 画面と API を同じオリジン（http://<サーバー>/）で出す。ログインの Cookie（SameSite=Lax）はこの形を前提にしている
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API: /api/xxx → app:8000/xxx（末尾の / で /api を外す。開発時の Vite のプロキシと同じ）
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 5m;
    }

    # ビルドで名前にハッシュが付くファイル: 長くキャッシュしてよい
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 画面の URL（/daily, /settings/... など）はすべて index.html を返す（SPA）。index.html は毎回確かめる
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
